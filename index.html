<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Cálculo para CTO</title>
	<link rel="stylesheet" href="assets/styles/style.css" />
</head>
<body>
	<header class="page-header">
		<h1>Cálculo para CTO's</h1>
	</header>

	<main>
		<div class="input-panel">
			<div class="signal-title-row" hidden>
				<div class="signal-heading">
					<h2 class="signal-title">Sinal Inicial</h2>
				</div>
				<div class="signal-value-row">
					<span class="signal-value"></span>
					<button class="edit-signal" type="button" aria-label="Editar Sinal Inicial" title="Editar Sinal Inicial">&#9998;</button>
				</div>
			</div>
			<label for="inputSignal">Sinal Inicial</label>
			<input id="inputSignal" type="number" step="0.1" placeholder="Potência recebida" required />
		</div>

		<div class="diagram-branch" aria-label="Adicionar etapa">
			<span class="diagram-line"></span>
			<button class="add-step" type="button" aria-label="Adicionar etapa">+</button>
		</div>
	</main>

	<script src="assets/scripts/script.js"></script>
</body>
</html>
